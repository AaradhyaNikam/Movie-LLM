<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Movie Expert AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-lg shadow-xl">
        <h2 class="text-3xl font-bold text-center mb-6">Sign Up 🎬</h2>
        
        {% if error %}
            <div class="bg-red-500/10 border border-red-500 text-red-500 p-3 rounded mb-4 text-center">
                {{ error }}
            </div>
        {% endif %}

        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label class="block mb-1 text-gray-400">Username</label>
                <input type="text" name="username" required class="w-full p-3 rounded bg-gray-700 border-none focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block mb-1 text-gray-400">Password</label>
                <input type="password" name="password" required minlength="6" class="w-full p-3 rounded bg-gray-700 border-none focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition mt-4">Create Account</button>
        </form>
        
        <p class="text-center text-gray-400 mt-6">
            Already have an account? <a href="/login" class="text-blue-400 hover:underline">Login</a>
        </p>
        <p class="text-center mt-2">
            <a href="/" class="text-gray-500 hover:text-white transition text-sm">← Back to search</a>
        </p>
    </div>
</body>
</html>
