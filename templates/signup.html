<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Movie Expert AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-gray-800 border border-gray-700/60 p-8 rounded-2xl shadow-2xl">
        <h2 class="text-3xl font-bold text-center mb-2">Create Account 🎬</h2>
        <p class="text-gray-400 text-sm text-center mb-6">Unlock unlimited searches and personalized recommendations</p>
        
        {% if error %}
            <div class="bg-red-500/10 border border-red-500 text-red-400 p-3 rounded-xl mb-4 text-center text-sm">
                {{ error }}
            </div>
        {% endif %}

        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label class="block mb-1 text-xs font-semibold text-gray-300 uppercase tracking-wider">Username</label>
                <input type="text" name="username" required 
                       class="w-full p-3.5 rounded-xl bg-gray-700/80 border border-gray-600 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
            </div>
            <div>
                <label class="block mb-1 text-xs font-semibold text-gray-300 uppercase tracking-wider">Password</label>
                <input type="password" name="password" required minlength="6" 
                       class="w-full p-3.5 rounded-xl bg-gray-700/80 border border-gray-600 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
            </div>
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 p-3.5 rounded-xl font-bold transition shadow-lg mt-2">
                Create Account
            </button>
        </form>
        
        <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account? <a href="/login" class="text-purple-400 hover:underline font-medium">Log in</a>
        </p>
        <p class="text-center mt-3">
            <a href="/" class="text-gray-500 hover:text-white transition text-xs">← Back to search</a>
        </p>
    </div>
</body>
</html>
